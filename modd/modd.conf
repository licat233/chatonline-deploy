/app/**/*.go {
    # prep: go build -o /app/app /app/main.go
    prep: GIT_COMMIT=$(git rev-parse HEAD) &&  GIT_COMMIT_DATE=$(git log --date=iso8601-strict -1 --pretty=%ct) &&  GIT_VERSION=$(git describe --tags --abbrev=0) &&  GIT_TREE_STATE=$(test -n "`git status --porcelain`" && echo "dirty" || echo "clean") && CGO_ENABLED=0 GOOS=linux go build -ldflags="-w -extldflags '-static' -X main.Commit=$GIT_COMMIT -X main.CommitDate=$GIT_COMMIT_DATE -X main.Version=$GIT_VERSION -X main.TreeState=$GIT_TREE_STATE" -installsuffix cgo  -o app ./main.go
    daemon +sigkill: /app/app api
}
