# 本项目的正向代理配置

# 这段 Nginx 配置的作用是将 HTTP 头部中的 Upgrade 字段的值为 "websocket" 的请求转换为 WebSocket 连接，从而实现升级握手。它使用了 Nginx 的 map 指令来定义一个映射变量 $connection_upgrade。
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 使用前，需修改相关路径，如ssl证书路径，以及日志路径

# 公网 nginx 的配置
# client_max_body_size 100m; # 限制上传文件的大小

# 内网 nginx 映射的 http 端口
upstream chatonline_internal_nginx_http_servers {
    server 127.0.0.1:10001 max_fails=3 fail_timeout=3s weight=10;
}

# tcp长连接端口（外网开放），不走反向代理了
upstream chatonline_im_tcp_servers {
    server 127.0.0.1:10002;
}

#websocket 代理，单独开出来的端口，不走反向代理了
upstream chatonline_im_ws_servers {
    server 127.0.0.1:10003;
}

# web服务
server {
    listen 80;
    listen 443 ssl;
    listen [::]:443 ssl;
    # 启用HTTP/2协议
    http2 on;
    # 严格匹配
    server_name web.im.catli.net im.catli.net;

    # SSL_CONFIG

    ssl_certificate /Users/licat/nginx/ssl/www.chat233.cc/server.pem;
    ssl_certificate_key /Users/licat/nginx/ssl/www.chat233.cc/server.key;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 5m;

    location / {
        proxy_set_header Host $host; #设置真实客户端地址，默认值是 $proxy_host;
        proxy_pass http://chatonline_internal_nginx_http_servers; # 真实服务器的地址，可以是ip也可以是域名和url地址;
    }
    access_log /Users/licat/nginx/logs/wwww.chat233.cc.log;
    error_log /Users/licat/nginx/logs/wwww.chat233.cc.error.log;
}

# im服务
server {
    listen 80;
    server_name im.chat233.cc;

    location /v1/ws {
        # proxy_read_timeout 86400; # 超时时间设置为一天
        proxy_pass http://chatonline_im_ws_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location /v1/tcp {
        proxy_pass http://chatonline_im_tcp_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location / {
        proxy_set_header Host $host; #设置真实客户端地址，默认值是 $proxy_host;
        proxy_pass http://chatonline_internal_nginx_http_servers; # 真实服务器的地址，可以是ip也可以是域名和url地址;
    }
    access_log /Users/licat/nginx/logs/im.chat233.cc.log;
    error_log /Users/licat/nginx/logs/im.chat233.cc.error.log;
}

# 接口服务
server {
    listen 80;
    listen 443 ssl;
    listen [::]:443 ssl;
    # 启用HTTP/2协议
    http2 on;
    server_name api.chat233.cc;

    # SSL_CONFIG
    ssl_certificate /Users/licat/nginx/ssl/api.chat233.cc/server.pem;
    ssl_certificate_key /Users/licat/nginx/ssl/api.chat233.cc/server.key;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 5m;

    # CORS_CONFIG，正向代理或者反向代理中配置就行，无需同时配置，因为在服务内部已经实现了cors，这里注释掉
    # add_header 'Access-Control-Allow-Origin' '$http_origin' always; # 允许跨域请求的域，*代表所有
    # add_header 'Access-Control-Allow-Credentials' 'true' always; # 允许带上cookie请求
    # add_header 'Access-Control-Allow-Methods' '$request_method' always; #允许请求的方法，比如 GET/POST/PUT/DELETE
    # add_header 'Access-Control-Allow-Headers' '*' always; # 允许请求的header

    # PROXY_CONFIG
    proxy_set_header Host $host; #设置真实客户端地址，默认值是 $proxy_host;
    proxy_set_header X-Real_IP $remote_addr; # 启用客户端真实地址（否则日志中显示的是代理在访问网站）
    proxy_set_header X-Real-IP $remote_addr; # 启用客户端真实地址（否则日志中显示的是代理在访问网站）
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 记录代理地址
    proxy_connect_timeout 60s; # 后端服务器连接的超时时间发起三次握手等候响应超时时间，默认60s
    proxy_send_timeout 60s; # 后端服务器数据回传时间就是在规定时间之内后端服务器必须传完所有的数据 默认60s
    proxy_read_timeout 60s; # nginx接收upstream（上游/真实） server数据超时, 默认60s, 如果连续的60s内没有收到1个字节, 连接关闭。像长连接，websockt的有效时间
    proxy_next_upstream error timeout invalid_header http_500 http_503 http_404; #指定应将请求传递到下一个服务器的情况
    proxy_set_header X-Forwarded-Proto $scheme; # 用于识别协议（HTTP 或 HTTPS）
    proxy_redirect off; # 修改被代理服务器返回的响应头中的Location头域和“refresh”头域;
    proxy_buffers 4 32k; # 设置存储被代理服务器响应的body所占用的buffer个数和每个buffer大小
    proxy_buffer_size 4k; # Nginx使用该大小申请read_buf，即大小指定了 upstream header 最大长度，如果响应头超过了这个长度，Nginx会报upstream sent too big header错误，然后client收到的是502。
    proxy_busy_buffers_size 64k; # nginx会在没有完全读完后端响应就开始向客户端传送数据，所以它会划出一部分busy状态的buffer来专门向客户端传送数据(建议为proxy_buffers中单个缓冲区的2倍)，然后它继续从后端取数据。
    proxy_temp_file_write_size 64k; # 设置同时写入临时文件的数据量的总大小。通常设置为8k或者16k。
    proxy_http_version 1.1; # nginx在代理是默认http版本为1.0，由于文件的下载涉及到使用分块传递，但http1.0是不支持这个特性的，所以需要设置为 1.1。
    proxy_set_header Connection "upgrade"; # 升级为长连接 websocket
    proxy_set_header Upgrade $http_upgrade; # 升级http协议
    proxy_set_header permissions-policy interest-cohort=(); # 不希望加入谷歌的 FLoC
    proxy_set_header Authorization $http_authorization; # 携带 Authorization 数据

    location /v1/im/ws {
        # proxy_read_timeout 86400; # 超时时间设置为一天
        proxy_pass http://chatonline_im_ws_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location /v1/im/tcp {
        proxy_pass http://chatonline_im_tcp_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location / {
        proxy_pass http://chatonline_internal_nginx_http_servers; # 真实服务器的地址，可以是ip也可以是域名和url地址
    }
    access_log /Users/licat/nginx/logs/api.chat233.cc.log;
    error_log /Users/licat/nginx/logs/api.chat233.cc.error.log;
}

# 拓展的服务
server {
    listen 80;
    # listen 443 ssl;
    # listen [::]:443 ssl;
    # http2 on; # 启用HTTP/2协议
    # 严格匹配
    server_name ~^(mysql|redis|web|admin|imui)?\.chat233.cc$;
    # server_name *.chat233.cc;
    location / {
        proxy_set_header Host $host; #设置真实客户端地址，默认值是 $proxy_host;
        proxy_pass http://chatonline_internal_nginx_http_servers; # 真实服务器的地址，可以是ip也可以是域名和url地址;
    }
    access_log /Users/licat/nginx/logs/multi.chat233.cc.log;
    error_log /Users/licat/nginx/logs/multi.chat233.cc.error.log;
}
