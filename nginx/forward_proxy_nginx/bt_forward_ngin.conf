# 内网 nginx 映射的 http 端口
upstream chatonline_internal_nginx_http_servers {
    server 127.0.0.1:50001 max_fails=3 fail_timeout=3s weight=10;
}
server {
    listen 80;
    server_name api.im.mixbench.net im.mixbench.net redis.im.mixbench.net mysql.im.mixbench.net imui.im.mixbench.net admin.im.mixbench.net web.im.mixbench.net;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/im.mixbench.net;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END
    #PHP-INFO-START  PHP引用配置，可以注释或修改
    include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/im.mixbench.net.conf;
    #REWRITE-END

    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known {
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location /v1/im/ws {
        proxy_read_timeout 86400; # 超时时间设置为一天
        proxy_pass http://127.0.0.1:50003;
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "Upgrade";
    }

    location / {
        proxy_pass http://chatonline_internal_nginx_http_servers; # 真实服务器的地址，可以是ip也可以是域名和url地址
        include mime.types;
        default_type application/octet-stream;
    }
    access_log /www/wwwlogs/im.mixbench.net.log;
    error_log /www/wwwlogs/im.mixbench.net.error.log;
}