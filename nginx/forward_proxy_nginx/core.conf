# 内网 nginx 映射的 http 端口
upstream chatonline_internal_nginx_http_servers {
    server 127.0.0.1:50001 max_fails=3 fail_timeout=3s weight=10;
}

# 置于sever块内

location /v1/im/ws {
    proxy_read_timeout 86400; # 超时时间设置为一天
    proxy_pass http://127.0.0.1:50003;
    # proxy_http_version 1.1;
    # proxy_set_header Upgrade $http_upgrade;
    # proxy_set_header Connection "Upgrade";
}

location / {
    proxy_pass http://chatonline_internal_nginx_http_servers; # 真实服务器的地址，可以是ip也可以是域名和url地址
    include mime.types;
    default_type application/octet-stream;
}