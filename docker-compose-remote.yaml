version: "3.1"
services:
  server:
    image: licat/chatonline-server:latest
    hostname: server
    container_name: ${COMPOSE_PROJECT_NAME}_server
    restart: always
    command: "api"
    healthcheck:
      test: "wget -q -Y off -O /dev/null http://localhost:8090/v1/ping > /dev/null 2>&1"
      interval: 10s
      timeout: 10s
      retries: 3
    environment:
      - TS_MODE=${TS_MODE}
      - TS_WUKONGIM_APIURL=http://wukongim:5001
      - TS_DB_MYSQLADDR=root:${MYSQL_ROOT_PASSWORD}@tcp(mysql)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=true&loc=Local
      - TS_DB_REDISADDR=redis:6379
      - TS_EXTERNAL_IP=${EXTERNAL_IP}
      - TS_SMSCODE=${TS_SMSCODE}
      - TS_FILESERVICE=${TS_FILESERVICE}
      - TS_MINIO_URL=http://minio:9000
      - TS_MINIO_ACCESSKEYID=${MINIO_ROOT_USER}
      - TS_MINIO_SECRETACCESSKEY=${MINIO_ROOT_PASSWORD}
      - TS_PROJECT_NAME=${PROJECT_NAME}
    depends_on:
      - redis
      - mysql
      - wukongim
    expose:
      - 8090
    ports:
      - 6001:8090
    volumes:
      - ./server/data:/home/tsdddata
      - ./server/config/tsdd.yaml:/home/configs/tsdd.yaml

  wukongim: # 悟空IM通讯服务
    image: registry.cn-shanghai.aliyuncs.com/wukongim/wukongim:latest
    hostname: wukongim
    container_name: ${COMPOSE_PROJECT_NAME}_wukongim
    restart: on-failure
    environment:
      - WK_MODE=${WK_MODE}
      - WK_EXTERNAL_IP=${EXTERNAL_IP}
      - WK_CONVERSATION_ON=true
      - WK_WEBHOOK_GRPCADDR=server:6979
      - WK_DATASOURCE_ADDR=http://server:8090/v1/datasource
      - WK_DATASOURCE_CHANNELINFOON=true
      - WK_TOKENAUTHON=true
    expose:
      - 5001
      - 5100
      - 5200
      - 5300
    ports:
      - 5100:5100 # tcp长连接端口（外网开放）
      - 5200:5200 # websocket端口（外网开放）
    #   - "6002:5300" # 系统监控UI端口
    # - "5172:5172" # demo端口
    # - "5001:5001" # api端口 （业务端调用，仅限内网开放）
    volumes:
      - ./wukongim/logs:/root/wukongim/logs
      - ./wukongim/wk.yaml:/root/wukongim/wk.yaml
      - im_volume:/root/wukongim/data

  web:
    image: licat/chatonline-web:latest
    hostname: web
    container_name: ${COMPOSE_PROJECT_NAME}_web
    restart: always
    environment:
      - API_URL
      - EXTERNAL_IP
    expose:
      - 80 # Web端口
    ports:
      - 6003:80
    volumes:
      - ./web/config.js:/usr/share/nginx/html/config.js

  admin:
    # image: licat/${COMPOSE_PROJECT_NAME}-admin:latest
    image: registry.cn-shanghai.aliyuncs.com/wukongim/tangsengdaodaomanager:latest
    restart: always
    hostname: admin
    container_name: ${COMPOSE_PROJECT_NAME}_admin
    environment:
      - API_URL
      - APP_ENV=dev
      - IS_CONFIG=false
    ports:
      - 6004:80

  minio: # minio文件管理服务
    image: minio/minio:latest # use a remote image
    hostname: minio
    container_name: ${COMPOSE_PROJECT_NAME}_minio
    expose:
      - 9000 # minio 文件服务端口
      - 9001 # minio 服务的管理接口
    command: "server /data --console-address ':9001'"
    # ports:
    #   - "9000:9000" # minio 文件服务端口
    #   - 6005:9001 # minio 服务的管理接口
    environment:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
      - MINIO_SERVER_URL
      - MINIO_BROWSER_REDIRECT_URL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - minio_volume:/data:rw

  mysql: # mysql数据库
    image: mysql:latest
    hostname: mysql
    container_name: ${COMPOSE_PROJECT_NAME}_mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD
      - MYSQL_DATABASE
    expose:
      - 3306
    volumes:
      - mysql_volume:/var/lib/mysql

  redis: # redis
    image: redis
    hostname: redis
    container_name: ${COMPOSE_PROJECT_NAME}_redis
    restart: on-failure
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - redis_volume:/data:rw

  mysql_manage: #phpmyadmin
    image: phpmyadmin:latest
    hostname: mysql_manage
    container_name: ${COMPOSE_PROJECT_NAME}_mysql_manage
    restart: on-failure
    expose:
      - 80
      - 8080
    # ports:
    #   - 6006:80
    environment:
      - TZ=${TZ}
      - PMA_ARBITRARY=1 #当设置为 1 连接到任意服务器将被允许
      - PMA_HOST=mysql #定义 MySQL 服务器的地址/主机名
      - PMA_PORT=3306 # 定义 MySQL 服务器的端口
      - PMA_VERBOSE=im_mysql #MySQL 服务器的详细名称
      - PMA_USER=root
      - PMA_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - PMA_PMADB=phpmyadmin
      - PMA_CONTROLUSER=admin
      - PMA_CONTROLPASS=123456
    depends_on:
      - mysql

  redis_manage: #phpredisadmin
    image: erikdubbelboer/phpredisadmin:latest
    hostname: redis_manage
    container_name: ${COMPOSE_PROJECT_NAME}_redis_manage
    restart: on-failure
    expose:
      - 80
    # ports:
    #   - 6007:80
    environment:
      - TZ=${TZ}
      - REDIS_1_HOST=redis
      - REDIS_1_PORT=6379
      # - ADMIN_USER=${REDIS_MANAGE_USERNAME} # Redis 可视化管理用户名称
      # - ADMIN_PASS=${REDIS_MANAGE_PASSWORD} # Redis 可视化管理用户密码
    depends_on:
      - redis

  # Nginx服务
  # nginx:
  #   image: nginx:latest
  #   hostname: nginx
  #   container_name: ${COMPOSE_PROJECT_NAME}_nginx
  #   restart: always
  #   privileged: true
  #   environment:
  #     - TZ=${TZ}
  #     - DOMAIN=${DOMAIN}
  #     - WEB_PORT
  #   ports:
  #     - ${NGINX_HTTP_PORT}:80
  #     - ${NGINX_HTTPS_PORT}:443
  #   volumes:
  #     - ./nginx/templates:/etc/nginx/templates
  #     - ./nginx/conf.d:/etc/nginx/conf.d
  #     - ./nginx/ssl:/etc/nginx/ssl
  #     - ./nginx/www:/www
  #     - nginx_volume:/var/log/nginx
  #   depends_on:
  #     - admin
  #     - server
  #     - wukongim
  #     - web

# 数据卷
volumes:
  go_volume:
  redis_volume:
  mysql_volume:
  minio_volume:
  nginx_volume:
  node_volume:
  im_volume:
